[platformio]
;default_envs = esp32
default_envs = esp32, esp32s2, esp32s3, esp32c3

[env_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
board = upesy_wroom
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
build_type = release
board_build.partitions = min_spiffs.csv
build_flags = 
      -Wall
      -D MRD_TIMEOUT=5             ; MRD: timeout for multiple reset detection
      -D MRD_RETRIES=5             ; MRD: number of retries for multiple reset detection

      -D USE_ESP_IDF_LOG
      -D CORE_DEBUG_LEVEL=ESP_LOG_DEBUG

      -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
      -D CONFIG_ASYNC_TCP_PRIORITY=5
      -D CONFIG_ASYNC_TCP_QUEUE_SIZE=256
      -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
      -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
      

extra_scripts = 
  post:scripts/build_release.py     ; Skript to create binary files for Flash tools and OTA Update
  post:scripts/checkVersion.py      ; Skript to check for version in source files


; ----------------------------------------------------------------
; OPTION 1: direct cable upload
; ----------------------------------------------------------------
;upload_port = /dev/cu.usbserial-576D0481591
;upload_port = /dev/cu.usbserial-0001
;upload_port = /dev/cu.usbmodem01

; ----------------------------------------------------------------
; OPTION 2: wireless OTA Update
; ----------------------------------------------------------------
;upload_protocol = espota
;upload_speed = 115000
;upload_port = 192.168.178.193   ; Conneted to Router
;upload_port = 192.168.4.1      ; Setup Mode (ESP create Accesspoint)


lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.7.2
  ESP32Async/AsyncTCP @ 3.3.6
  bblanchon/ArduinoJson @ 7.3.1
  ; Git dependencies must be pinned by tag (#vX.Y.Z) or commit SHA. The
  ; "@ X.Y.Z" form is NOT a version constraint for a plain git URL - it only
  ; compares against whatever library.json declares at HEAD, so the build
  ; breaks as soon as upstream publishes a new version.
  https://github.com/dewenni/EspWebUI#v0.0.4
  https://github.com/dewenni/EspStrUtil#v1.1.0
  ; EspSysUtil 1.1.0 and ESP_Git_OTA 0.0.2 are untagged, so they are pinned by SHA.
  https://github.com/dewenni/EspSysUtil#38011bd9cf6f57388f0c89be3556b5944b905936
  https://github.com/dewenni/ESP_Git_OTA#d9e669b56ab62c98e75a249087444b811c9bb3cf


[env:esp32]
extends = env_common
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_flash_size = 4MB

[env:esp32s2]
extends = env_common
board_build.mcu = esp32s2
board_build.f_cpu = 240000000L
board_flash_size = 4MB

[env:esp32s3]
extends = env_common
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_flash_size = 4MB

[env:esp32c3]
extends = env_common
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_flash_size = 4MB