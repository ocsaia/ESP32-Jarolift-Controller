    <title>ESP Async Web Server</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="../css/pico.css" />
    <link rel="stylesheet" type="text/css" href="../css/custom.css" />
    <link rel="stylesheet" type="text/css" href="../css/icons.css" />
    <script src="../js/fun.js" defer></script>
    <script src="../js/doc.js" defer></script>
    <script src="../js/user.js" defer></script>
    <script src="../js/lang.js" defer></script>
    <style></style>
    <script>
      function test() {
        document.getElementById("tab3").classList.add("active");
        localizePage("de");
      }
      setInterval(test, 1000);
    </script>
  </head>
  <body>
    <!-- Layout -->
    <header
      style="
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      "></header>
    <!-- Tab-Content -->
    <main class="container">
      <!--SECTION-START-->
      <!-- Tab-3 -->
      <div id="tab3" class="tab-content">
        <div class="grid" id="timers-container">
          <article>
            <div class="dash-main">
              <div class="dash-header">Timer 1</div>
              <div class="section-header">
                <label for="timer0_enable" data-i18n="activate"></label>
                <div class="switch-container">
                  <input
                    name="timer0_enable"
                    type="checkbox"
                    role="switch"
                    hideOpt="OPT_TIMER0"
                    id="cfg_timer_0_enable" />
                </div>
              </div>
              <br />
              <form id="timerForm0" class="OPT_TIMER0">
                <fieldset>
                  <label for="timeType0" data-i18n="timer_type"></label>
                  <select
                    id="cfg_timer_0_type"
                    name="timeType0"
                    data-toggle="timeInputs"
                    onchange="toggleTimeInputs(this)">
                    <option value="0" data-i18n="time"></option>
                    <option value="1" data-i18n="sunrise"></option>
                    <option value="2" data-i18n="sundown"></option>
                  </select>

                  <div class="time-input" id="timeInput0">
                    <label for="timeValue0" data-i18n="time_HH_MM"></label>
                    <input
                      type="time"
                      id="cfg_timer_0_time_value"
                      name="timeValue0" />
                  </div>

                  <div
                    class="time-input"
                    id="offsetInput0"
                    style="display: none">
                    <label for="offsetValue0" data-i18n="offset_desc"></label>
                    <input
                      type="number"
                      id="cfg_timer_0_offset_value"
                      name="offsetValue0"
                      placeholder="0"
                      step="1" />
                  </div>

                  <!-- min/max time settings for sunrise/sundown -->
                  <div id="timer0-minmaxtime-settings" style="display: none">
                    <label for="astroMode0" data-i18n="astro_mode"></label>
                    <select
                      id="cfg_timer_0_astro_mode"
                      name="astroMode0"
                      onchange="toggleHorizonInput(this)">
                      <option value="0" data-i18n="astro_real"></option>
                      <option value="1" data-i18n="astro_civil"></option>
                      <option value="2" data-i18n="astro_nautical"></option>
                      <option value="3" data-i18n="astro_astronomical"></option>
                      <option value="4" data-i18n="astro_horizon"></option>
                    </select>

                    <div
                      class="time-input"
                      id="horizonInput0"
                      style="display: none">
                      <label
                        for="horizonValue0"
                        data-i18n="horizon_desc"></label>
                      <input
                        type="number"
                        id="cfg_timer_0_horizon_value"
                        name="horizonValue0"
                        placeholder="0"
                        min="-10"
                        max="30"
                        step="1" />
                    </div>

                    <div class="minmaxtime-switch">
                      <input
                        data-toggle="timeInputs"
                        name="timer0_use_min_time"
                        type="checkbox"
                        role="switch"
                        hideOpt="OPT_MINTIME0"
                        id="cfg_timer_0_use_min_time" />

                      <label
                        for="timer0_use_min_time"
                        data-i18n="use_min_time"></label>
                    </div>

                    <div class="time-input OPT_MINTIME0" id="minTimeInput0">
                      <input
                        type="time"
                        id="cfg_timer_0_min_time_value"
                        name="minTimeValue0" />
                    </div>

                    <div class="minmaxtime-switch">
                      <input
                        data-toggle="timeInputs"
                        name="timer0_use_max_time"
                        type="checkbox"
                        role="switch"
                        hideOpt="OPT_MAXTIME0"
                        id="cfg_timer_0_use_max_time" />

                      <label
                        for="timer0_use_max_time"
                        data-i18n="use_max_time"></label>
                    </div>

                    <div class="time-input OPT_MAXTIME0" id="maxTimeInput0">
                      <input
                        type="time"
                        id="cfg_timer_0_max_time_value"
                        name="maxTimeValue0" />
                    </div>
                  </div>

                  <!-- Dropdown for shutter cmd -->
                  <label for="command0" data-i18n="command"></label>
                  <select id="cfg_timer_0_cmd" name="command0">
                    <option value="0" data-i18n="cmd_up"></option>
                    <option value="1" data-i18n="cmd_down"></option>
                    <option value="2" data-i18n="cmd_shade"></option>
                  </select>

                  <!-- Checkbox for wekdays -->
                  <label data-i18n="weekdays"></label>
                  <div class="grid">
                    <div>
                      <input
                        type="checkbox"
                        id="cfg_timer_0_monday"
                        name="days0" />
                      <label for="monday0" data-i18n="day_mo"></label>
                    </div>
                    <div>
                      <input
                        type="checkbox"
                        id="cfg_timer_0_tuesday"
                        name="days0" />
                      <label for="tuesday0" data-i18n="day_tu"></label>
                    </div>
                    <div>
                      <input
                        type="checkbox"
                        id="cfg_timer_0_wednesday"
                        name="days0" />
                      <label for="wednesday0" data-i18n="day_we"></label>
                    </div>
                    <div>
                      <input
                        type="checkbox"
                        id="cfg_timer_0_thursday"
                        name="days0" />
                      <label for="thursday0" data-i18n="day_th"></label>
                    </div>
                    <div>
                      <input
                        type="checkbox"
                        id="cfg_timer_0_friday"
                        name="days0" />
                      <label for="friday0" data-i18n="day_fr"></label>
                    </div>
                    <br />
                    <div>
                      <input
                        type="checkbox"
                        id="cfg_timer_0_saturday"
                        name="days0" />
                      <label for="saturday0" data-i18n="day_sa"></label>
                    </div>
                    <div>
                      <input
                        type="checkbox"
                        id="cfg_timer_0_sunday"
                        name="days0" />
                      <label for="sunday0" data-i18n="day_su"></label>
                    </div>
                  </div>
                  <!-- selection of shutter -->
                  <div>
                    <div class="leftright">
                      <label for="mask_timer0" data-i18n="mask"></label>
                      <button
                        onclick="openGrpMaskHelp(this)"
                        class="i_help"
                        style="
                          height: 20px;
                          background-color: transparent;
                          border: none;
                        "></button>
                    </div>
                    <input
                      class="bitmask-input"
                      name="mask_timer0"
                      type="text"
                      data-type="bin"
                      id="cfg_timer_0_grp_mask"
                      oninput="validateBin(this)"
                      onblur="formatBin(this)"
                      pattern="[01]{1,16}"
                      placeholder="Enter Bit-Mask (0 and 1 only, 16 chars)"
                      maxlength="16" />
                  </div>
                  <br />
                </fieldset>
              </form>
            </div>
          </article>
