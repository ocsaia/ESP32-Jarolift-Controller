name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# actions-gh-pages pushes the built site to the gh-pages branch. The default
# GITHUB_TOKEN is read-only, so without this the deploy step fails on every
# push to main - which is what it had been doing on this fork.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 4. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/output
