name: Build and test

# Runs on every pull request, so branch protection has something real to require
# before main can move.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_test:
    name: Tests and firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Also fetches Unity, which the native tests link against.
      - name: Resolve dependencies
        run: pio pkg install -e esp32

      # No hardware and no emulator needed. These are the only automated check of
      # the position tracker and the timer logic - arithmetic over a clock, which
      # compiles perfectly well when it is wrong.
      - name: Native unit tests
        run: sh test/run_native_tests.sh

      - name: Build firmware
        run: pio run -e esp32 -e esp32s2 -e esp32s3 -e esp32s3_16mb -e esp32c3 2>&1 | tee build.log

      # The project is warning-free; a new warning in src/ or lib/ is a
      # regression rather than noise. Framework and library warnings are not ours.
      - name: Check for warnings in project sources
        run: |
          if grep -E '^(src|lib)/.*warning:' build.log; then
            echo "::error::project sources produced warnings"
            exit 1
          fi
          echo "no warnings from project sources"
